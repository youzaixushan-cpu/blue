[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  # このサイトは同時ビルドなしの単一ブランチ構成のため、並行migrate実行の
  # 心配はない。Netlifyのビルド環境からNeonへのadvisory lock取得
  # （SELECT pg_advisory_lock）が原因不明のまま10秒でタイムアウトし
  # `prisma migrate deploy`がP1002で失敗する事象が発生したため無効化する。
  PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ログイン(Credentials)・サインアップへの総当たり対策。NextAuthは通常の
# ログインフロー中にsession/csrf/providers等も叩くため、正規利用を誤検知
# しない程度の余裕を持たせている。
[[redirects]]
  from = "/api/auth/*"
  to = "/api/auth/:splat"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]

# 旧vercel.jsonのcron（毎週日曜3:00 UTC）を移植。実行内容はnetlify/functions/sync-wikidata.mts側。
[functions."sync-wikidata"]
  schedule = "0 3 * * 0"
